<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Daily Quran Wallpaper</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { margin:0; background:#0e0e10; color:#c9a961; font-family: ui-sans-serif, system-ui, sans-serif;
           display:flex; flex-direction:column; align-items:center; padding:24px; }
    h1   { font-weight:400; letter-spacing:.08em; text-transform:uppercase; font-size:.95rem; opacity:.8; }
    img  { max-width: min(92vw, 360px); height:auto; border:1px solid #c9a96155; border-radius:8px; }
    code { background:#1a1a1f; padding:2px 6px; border-radius:4px; }
    a    { color:#c9a961; }
    p    { max-width: 480px; line-height:1.5; }
  </style>
</head>
<body>
  <h1>Daily Quran Wallpaper</h1>
  <p>Today's wallpaper, refreshed daily at 05:00 UTC. Direct image URL:
     <code>./wallpaper.png</code></p>
  <a href="./wallpaper.png"><img src="./wallpaper.png?t=1" alt="Today's Quran wallpaper" /></a>
  <p>See <a href="./wallpaper.json">wallpaper.json</a> for metadata.</p>
</body>
</html>
